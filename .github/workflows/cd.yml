name: CD Build & Release

on:
  push:
    tags:
      - "v*.*.*.*"
  workflow_dispatch:
    inputs:
      branch_name:
        description: "Branch to run the workflow on"
        required: true
        default: "master"

jobs:
  ci:
    name: CI Quality Gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build
    needs: ci
    uses: ./.github/workflows/build.yml

  release:
    name: Release
    uses: ./.github/workflows/release.yml
    needs: build
    permissions: write-all
