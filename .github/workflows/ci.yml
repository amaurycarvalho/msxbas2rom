name: CI Quality Gate

on:
  push:
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      branch_name:
        description: "Branch to run the workflow on"
        required: true
        default: "master"

jobs:
  ci-hardened:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Hardened unit testing
        run: |
          make test-unit
      - name: Sanitizer unit testing
        run: |
          make test-sanitize

  ci-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr pasmo
      - name: Linting
        run: |
          make lint
      - name: Architecture boundary check
        run: |
          make test-architecture
      - name: Unit testing with coverage
        run: |
          make test-coverage
      - name: Kernel testing
        run: |
          make test-kernel
      - name: Integration testing
        run: |
          make test-integration
